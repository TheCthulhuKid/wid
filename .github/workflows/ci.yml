name: CI

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags, so hatch-vcs can read the version from the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install the pinned development environment
        run: uv sync --locked --group dev

      - name: Tests with coverage
        run: uv run --no-sync python -m pytest --cov -n 8

      # The installed command, started headless as a release build is, on every push.
      - name: Self-test
        run: uv run --no-sync wid --self-test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Ruff reads the source, so the project itself is not installed (or versioned) here.
      - name: Install the pinned development tools
        run: uv sync --locked --group dev --no-install-project

      - name: Lint
        run: uv run --no-sync python -m ruff check .

      - name: Format
        run: uv run --no-sync python -m ruff format --check .
