name: CI

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install the pinned development environment
        run: uv sync --locked --group dev

      - name: Tests
        run: uv run --no-sync python -m pytest --cov

      - name: Lint
        run: uv run --no-sync python -m ruff check .

      - name: Format
        run: uv run --no-sync python -m ruff format --check .
