name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # The builds and the Windows smoke test also run on pull requests, so a change that breaks
  # them is found before it reaches main. Only a tag publishes (see the publish job).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The whole history and its tags, so hatch-vcs can read the version from the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Build, self-test and smoke-test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File release\build_release.ps1 -Python 3.13 -Smoke

      - uses: actions/upload-artifact@v4
        with:
          name: wid-windows
          path: |
            dist/wid-*-windows-*.zip
            dist/wid-*-windows-*.zip.sha256
          if-no-files-found: error

  unix:
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, because the program only runs on this glibc or newer.
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Build and self-test
        run: bash release/build_release.sh 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: wid-${{ matrix.name }}
          path: |
            dist/wid-*.tar.gz
            dist/wid-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md and the script that takes this tag's notes from it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wid-*
          merge-multiple: true
          path: dist

      # The notes are the tag's section of CHANGELOG.md; a tag without one stops the release here.
      - name: Take the release notes from the changelog
        run: python3 release/changelog_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # A draft, so the release is only published when you decide to.
      - name: Attach the files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
