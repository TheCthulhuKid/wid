{#- The session block: the name, the notes with their preview, the file, uploads and the
    history export, on both pages. -#}
    <section class="block session-notes" aria-labelledby="session-title">
      <h2 id="session-title">Session</h2>
      <label class="field">Session name
        <input name="session-name" value="{{ game.name }}">
      </label>
      <div class="row notes-tools">
        <button type="button" data-format="bold" {% if preview %}disabled{% endif %}>Bold</button>
        <button type="button" data-format="italic" {% if preview %}disabled{% endif %}>Italic</button>
        <button type="button" data-format="heading" {% if preview %}disabled{% endif %}>Heading</button>
        <label class="tick"><input type="checkbox" name="notes-preview" data-action="update" {% if preview %}checked{% endif %}> Preview</label>
      </div>
      <label class="field {% if preview %}visually-hidden{% endif %}">Notes
        <textarea name="notes" rows="8">{{ game.notes }}</textarea>
      </label>
      {% if preview %}<div class="notes-preview">{{ notes_html | safe }}</div>{% endif %}

      <div class="row named">
        <label class="field grow">Session file
          <input name="session-path" value="{{ game.path }}" placeholder="/path/to/session.json">
        </label>
        <button class="primary" formaction="/actions/save">Save session</button>
        <button formaction="/actions/load">Load session</button>
      </div>
      <div class="row named">
        <label class="field grow">Upload a save
          <input type="file" accept=".json,application/json" data-upload>
        </label>
        {% if savable %}<a class="button" href="/session.json" download>Download save</a>{% endif %}
      </div>
      <div class="row named">
        <label class="field grow">History file
          <input name="export-path" value="{{ export_path }}">
        </label>
        <button formaction="/actions/export" {% if not history %}disabled{% endif %}>Export history</button>
        {% if history %}<a class="button" href="/history.md" download>Download history</a>{% endif %}
      </div>
    </section>
