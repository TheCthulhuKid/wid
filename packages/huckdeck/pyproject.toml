[project]
name = "huckdeck"
version = "0.1.0"
description = "A terminal card dealer with suited jokers"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "rich",
    "textual>=8.2.8",
]

[project.scripts]
huckdeck = "huckdeck.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huckdeck"]

[tool.pytest.ini_options]
pythonpath = ["."]
