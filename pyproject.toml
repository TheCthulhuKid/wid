[project]
name = "wid"
version = "0.1.0"
description = "A terminal dice roller for We're in Danger"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "textual>=8.2.8",
]

[project.scripts]
wid = "wid.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wid"]

[tool.hatch.build.targets.sdist]
only-include = [
    "wid", "README.md", "pyproject.toml", "uv.lock", "game.md", "tests",
]

[tool.uv.workspace]
members = ["packages/huckdeck"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "textual-dev>=1.8.0",
    "huckdeck",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "packages/huckdeck/tests"]
addopts = "-n 4"
markers = ["ui: starts an application (slow); deselect with -m \"not ui\""]

[tool.uv.sources]
huckdeck = { workspace = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wid", "huckdeck"]
