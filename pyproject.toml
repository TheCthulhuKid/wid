[project]
name = "wid"
version = "0.1.0"
description = "A terminal dice roller for We're in Danger"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "textual>=8.2.8",
]

[project.scripts]
wid = "wid.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wid"]

[tool.hatch.build.targets.sdist]
only-include = [
    "wid", "release", "README.md", "HOWTO.md", "DEVELOPING.md", "pyproject.toml", "uv.lock", "tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "textual-dev>=1.8.0",
    "pytest-xdist>=3.8.0",
]
release = [
    "pyinstaller>=6.22.3",
]
smoke = [
    "pywinpty>=2 ; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n 4"
markers = ["ui: starts an application (slow); deselect with -m \"not ui\""]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wid"]
