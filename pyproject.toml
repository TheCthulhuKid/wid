[project]
name = "wid"
dynamic = ["version"]
description = "A terminal dice roller for We're in Danger"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.5",
    "textual>=8.2.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
wid = "wid.cli:main"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version comes from the latest git tag (v0.1.0 gives 0.1.0); commits after it get a dev
# version such as 0.1.1.dev3+gabc1234.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["wid"]

[tool.hatch.build.targets.sdist]
only-include = [
    "wid", "release", "README.md", "HOWTO.md", "DEVELOPING.md", "pyproject.toml", "uv.lock", "tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "textual-dev>=1.8.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "httpx2>=2.16.0",
]
release = [
    "pyinstaller>=6.22.3",
]
smoke = [
    "pywinpty>=2 ; sys_platform == 'win32'",
]

# Rebuild the installed project when a commit or tag changes its version, not only pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n 4"
markers = ["ui: starts an application (slow); deselect with -m \"not ui\""]

[tool.coverage.run]
source = ["wid"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wid"]
